name: Release desktop

on:
  push:
    branches: [main]
    paths:
      - apps/desktop/package.json
      - apps/desktop/src-tauri/tauri.conf.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAURI=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$TAURI" ]; then
            echo "apps/desktop/package.json version ($VERSION) does not match src-tauri/tauri.conf.json ($TAURI)" >&2
            exit 1
          fi
          if [ "$VERSION" = "0.0.0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "desktop-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/desktop/src-tauri -> target

      - name: install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          FILE="apps/desktop/release-notes/v${VERSION}.md"
          DELIM="GPIOC_RELEASE_NOTES_END"
          {
            echo "body<<${DELIM}"
            if [ -s "$FILE" ]; then
              cat "$FILE"
              echo
            else
              echo "Windows, Linux, and macOS BLE companion. Project, Keys, and Credits stay on the web dashboard."
            fi
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: gpio-companion desktop v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}
